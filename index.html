<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="EAデータ — 学習リンクをまとめたポータル">
  <title>EAデータ</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1118;--panel:#121c27;--panel2:#172534;--text:#e9f1f8;--muted:#94a8bb;--line:#2b3c4d;--accent:#70e1c2;--blue:#8ab9ff;--danger:#ff8d9b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#173148 0%,transparent 65%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
    a{color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}
    .brand{display:flex;gap:12px;align-items:center}.logo{height:44px;width:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#09131b;font-weight:900;font-size:18px}
    h1{font-size:clamp(28px,5vw,42px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);margin:4px 0 0}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:12px}
    .hero{padding:24px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(112,225,194,.09),rgba(138,185,255,.05)),var(--panel);border-radius:24px;margin-bottom:24px}
    .hero h2{font-size:24px;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}
    .controls{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:20px 0}.field{width:100%;background:#0c141d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}.field:focus{border-color:var(--accent)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 12px}.section-head h2{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-2px);border-color:#52758b}
    .card-top{display:flex;justify-content:space-between;gap:8px}.tag{font-size:11px;color:var(--accent);background:rgba(112,225,194,.1);border:1px solid rgba(112,225,194,.18);border-radius:999px;padding:4px 8px;white-space:nowrap}
    .card h3{margin:13px 0 6px;font-size:17px;overflow-wrap:anywhere}.card p{color:var(--muted);font-size:13px;margin:0 0 14px;min-height:38px;overflow-wrap:anywhere}
    .open{display:inline-flex;text-decoration:none;background:var(--panel2);border:1px solid var(--line);padding:8px 11px;border-radius:10px;font-size:13px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);color:var(--muted);border-radius:16px;grid-column:1/-1}
    .columns{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:30px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}.panel h2{margin:0 0 6px;font-size:20px}.stack{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px}.btn.primary{background:var(--accent);color:#081611;border-color:var(--accent);font-weight:750}.btn.danger{border-color:rgba(255,141,155,.4);color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}
    .comment{padding:13px 0;border-bottom:1px solid var(--line)}.comment:last-child{border-bottom:0}.comment-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:7px;flex-wrap:wrap}.comment p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.comment-status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:750;white-space:nowrap;border:1px solid var(--line)}.comment-status.resolved{color:#081611;background:var(--accent);border-color:var(--accent)}.comment-status.pending{color:#ffdda0;background:rgba(255,221,160,.09);border-color:rgba(255,221,160,.35)}.comment-target{display:block;color:var(--blue);font-size:11px;margin:0 0 6px;overflow-wrap:anywhere}
    .notice{background:rgba(138,185,255,.08);border:1px solid rgba(138,185,255,.2);border-radius:12px;padding:12px;color:#b7d2f8;font-size:13px}.status{min-height:20px;color:var(--accent);font-size:13px}.admin{margin-top:20px}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
    @media(max-width:720px){.columns{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.top{align-items:flex-start}.pill{display:none}.hero{padding:19px}.panel{padding:16px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">EA</div><div><h1>EAデータ</h1><p class="sub">学習リンクを、すばやく開く。</p></div></div>
    <div class="pill">LINK HUB / GITHUB PAGES</div>
  </header>
  <section class="hero"><h2>必要なリンクを、ここから。</h2><p>リンクを検索したり、カテゴリで絞り込んだりできます。</p></section>

  <div class="section-head"><h2>リンク一覧</h2><span class="muted" id="link-count"></span></div>
  <div class="controls"><input id="search" class="field" type="search" placeholder="リンク名・説明で検索…" aria-label="リンクを検索"><select id="category" class="field" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select></div>
  <div id="links" class="grid"><div class="empty">リンクを読み込んでいます…</div></div>

  <div class="columns">
    <section class="panel">
      <h2>コメント</h2><p class="muted">リンクについてのメモや連絡を残せます。</p>
      <form id="comment-form" class="stack">
        <label for="comment-target" class="muted">対象のリンク</label>
        <select id="comment-target" class="field" required><option>2年２学期期末</option></select>
        <label for="comment-text" class="muted">コメント</label>
        <textarea id="comment-text" class="field" rows="4" maxlength="500" placeholder="例:67番のsucessのつずりはsuccessです" required></textarea>
        <button class="btn primary" type="submit">コメントを送信</button><div id="comment-status" class="status" role="status"></div>
      </form>
      
      <div class="section-head"><h2>過去のコメント</h2><span id="comment-count" class="muted"></span></div>
      <div id="comments"><p class="muted">コメントを読み込んでいます…</p></div>
    </section>

    <section class="panel">
      <h2>管理者</h2><p class="muted"></p>
      <div id="admin-logged-out" class="stack">
        <input id="admin-password" class="field" type="password" placeholder="管理者パスワード" autocomplete="current-password">
        <button id="admin-login" class="btn" type="button">管理者ログイン</button>
        <div id="admin-status" class="status" role="status"></div>
      </div>
      <div id="admin-panel" class="hidden stack">
        <div class="notice">管理者操作はサーバー側で認証します。ログインの有効期限は既存設定に従います。</div>
        <label for="new-title" class="muted">リンク名</label><input id="new-title" class="field" placeholder="リンク名">
        <label for="new-description" class="muted">説明</label><input id="new-description" class="field" placeholder="リンクの説明">
        <label for="new-url" class="muted">URL</label><input id="new-url" class="field" type="url" placeholder="https://…">
        <label for="new-category" class="muted">カテゴリ</label><input id="new-category" class="field" placeholder="例：教材">
        <button id="add-link" class="btn primary" type="button">リンクを追加</button>
        <div class="section-head"><h2>コメント管理</h2></div>
        <div id="admin-comments" class="stack"><p class="muted">管理者ログイン後に表示します。</p></div>
        <button id="clear-comments" class="btn danger" type="button">過去のコメントをクリア</button>
      </div>
    </section>
  </div>
  <footer>EAデータ · GitHub Pages</footer>
</div>
<script>
(() => {
  'use strict';

  const API_URL = 'https://script.google.com/macros/s/AKfycbzi0Ofrr3Pb-3ojZ-2FsgR0dHv442PYMr8WKRxo2e9kkFxCWpaxx8boS6wA0Z5eSsG6/exec';
  const DEFAULT_COMMENT_TITLE = '2年2学期期末';
  let LINKS = [
    {title:'2年１学期中間', description:'中学2年生・1学期中間テスト', url:'https://1drv.ms/x/c/fccdfa5aea1bb1be/IQD1IKeB8iy6QbIRX58dxzfyAfza5t3ZIbu_9wxwgRRI2pA', category:'tests', tags:['2年','1学期','中間テスト']},
    {title:'2年１学期期末', description:'中学2年生・1学期期末テスト', url:'https://1drv.ms/x/c/fccdfa5aea1bb1be/IQDFYicUnjecT7QNTSkqRK4dAQFOCmTSZxI16hkYJf3dEKE', category:'tests', tags:['2年','1学期','期末テスト']},
    {title:'2年2学期中間', description:'中学2年生・2学期中間テスト', url:'https://1drv.ms/x/c/fccdfa5aea1bb1be/IQCWEwjzoT7lQ5laNTyasz3VATUFPYaWtImw4bHcABgseyQ', category:'tests', tags:['2年','2学期','中間テスト']},
    {title:'2年2学期期末', description:'中学2年生・2学期期末テスト', url:'https://1drv.ms/x/c/fccdfa5aea1bb1be/IQAY_8nqJqraTKLooBlc8bAvASsY8RigwujRr-8fcsoCWVg', category:'tests', tags:['2年','2学期','期末テスト']},
    {title:'2年学年末', description:'中学2年生・学年末テスト', url:'https://1drv.ms/x/c/fccdfa5aea1bb1be/IQDRuMbWdZzXSYzVrvT5pMqeAZKKKuuDX-uZjiqQbjj2Spo', category:'tests', tags:['2年','学年末','期末テスト']}
  ];
  let adminToken = '';
  let adminComments = [];
  const $ = id => document.getElementById(id);
  const linksRoot = $('links');
  const categorySelect = $('category');
  const commentTarget = $('comment-target');

  // GASはCORS制限があるため、非表示フォームでPOSTし、返却HTMLのpostMessageを受け取る。
  // Google側のリダイレクトでevent.sourceが変わる環境があるため、推測困難なrequestIdで応答を照合する。
  function apiCall(action, args = {}) {
    return new Promise((resolve, reject) => {
      const requestId = 'ea_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
      const frameName = requestId + '_frame';
      const iframe = document.createElement('iframe');
      iframe.name = frameName;
      iframe.title = 'EAデータ API';
      iframe.hidden = true;

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = API_URL;
      form.target = frameName;
      form.hidden = true;

      const payload = document.createElement('input');
      payload.type = 'hidden';
      payload.name = 'payload';
      payload.value = JSON.stringify({requestId, action, args});
      form.append(payload);

      let finished = false;
      let timeoutId;
      const cleanup = () => {
        window.removeEventListener('message', onMessage);
        if (timeoutId) window.clearTimeout(timeoutId);
        form.remove();
        iframe.remove();
      };
      const finish = (fn, value) => {
        if (finished) return;
        finished = true;
        cleanup();
        fn(value);
      };
      const onMessage = event => {
        const data = event.data;
        if (!data || data.type !== 'EA_DATA_RESULT' || data.requestId !== requestId) return;
        if (data.ok) finish(resolve, data.data);
        else finish(reject, new Error(data.error || 'GAS APIでエラーが発生しました。'));
      };

      window.addEventListener('message', onMessage);
      document.body.append(iframe, form);
      timeoutId = window.setTimeout(() => {
        finish(reject, new Error('GASから応答がありません。Apps ScriptにApiBridge.gsを追加し、ウェブアプリを再デプロイしたか確認してください。'));
      }, 20000);
      try {
        form.submit();
      } catch (error) {
        finish(reject, error);
      }
    });
  }

  function setStatus(id, message, isError = false) {
    const el = $(id);
    if (!el) return;
    el.textContent = message;
    el.style.color = isError ? 'var(--danger)' : 'var(--accent)';
  }
  function safeUrl(value) {
    try { const url = new URL(value, location.href); return ['http:','https:'].includes(url.protocol) ? url.href : '#'; }
    catch { return '#'; }
  }
  function categoryName(category) {
    if (!category || category === 'tests') return 'テスト資料';
    return category;
  }
  function populateCategories() {
    const current = categorySelect.value;
    categorySelect.replaceChildren();
    const all = document.createElement('option');
    all.value = '';
    all.textContent = 'すべてのカテゴリ';
    categorySelect.append(all);
    [...new Set(LINKS.map(item => categoryName(item.category)))].sort().forEach(category => {
      const option = document.createElement('option');
      option.value = category;
      option.textContent = category;
      categorySelect.append(option);
    });
    if ([...categorySelect.options].some(option => option.value === current)) categorySelect.value = current;
  }
  function populateCommentTargets() {
    const previous = commentTarget.value;
    commentTarget.replaceChildren();
    const titles = [...new Set([DEFAULT_COMMENT_TITLE, ...LINKS.map(link => link.title)])];
    titles.forEach(title => {
      const option = document.createElement('option');
      option.value = title;
      option.textContent = title.replace('2年一学期', '2年１学期');
      commentTarget.append(option);
    });
    commentTarget.value = titles.includes(previous) ? previous : DEFAULT_COMMENT_TITLE;
  }
  function renderLinks() {
    const query = $('search').value.trim().toLocaleLowerCase();
    const category = categorySelect.value;
    const shown = LINKS.filter(link =>
      (!category || categoryName(link.category) === category) &&
      (!query || (link.title + ' ' + link.description + ' ' + categoryName(link.category) + ' ' + (link.tags || []).join(' ')).toLocaleLowerCase().includes(query))
    );
    $('link-count').textContent = shown.length + ' 件';
    linksRoot.replaceChildren();
    if (!shown.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '一致するリンクがありません。';
      linksRoot.append(empty);
      return;
    }
    shown.forEach(link => {
      const card = document.createElement('article');
      card.className = 'card';
      const top = document.createElement('div');
      top.className = 'card-top';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = categoryName(link.category);
      top.append(tag);
      const icon = document.createElement('span');
      icon.className = 'muted';
      icon.textContent = '↗';
      top.append(icon);
      const title = document.createElement('h3');
      title.textContent = link.title.replace('2年一学期', '2年１学期');
      const description = document.createElement('p');
      description.textContent = link.description || '';
      const anchor = document.createElement('a');
      anchor.className = 'open';
      anchor.href = safeUrl(link.url);
      anchor.textContent = link.url && link.url !== '#' ? 'リンクを開く ↗' : 'リンク先未設定';
      if (anchor.href !== '#' && new URL(anchor.href).origin !== location.origin) {
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
      }
      card.append(top, title, description, anchor);
      linksRoot.append(card);
    });
  }
  function renderPublicComments(comments) {
    const root = $('comments');
    root.replaceChildren();
    $('comment-count').textContent = (comments || []).length + ' 件';
    if (!comments || !comments.length) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'このリンクへのコメントはまだありません。';
      root.append(p);
      return;
    }
    comments.forEach(comment => {
      const item = document.createElement('article');
      item.className = 'comment';
      const meta = document.createElement('div');
      meta.className = 'comment-meta';
      const who = document.createElement('span');
      who.textContent = (comment.nickname || '匿名') + ' · ' + (comment.timestamp || '');
      const status = document.createElement('span');
      const resolved = comment.resolved === true || String(comment.resolved) === 'true';
      status.className = 'comment-status ' + (resolved ? 'resolved' : 'pending');
      status.textContent = resolved ? '✓ 対応済み' : '● 確認中';
      status.setAttribute('aria-label', resolved ? '管理者が対応済みにしました' : '管理者の対応待ちです');
      meta.append(who, status);
      const target = document.createElement('div');
      target.className = 'comment-target';
      target.textContent = '対象：' + (comment.title || 'リンク未指定');
      const body = document.createElement('p');
      body.textContent = comment.comment || '';
      item.append(meta, target, body);
      root.append(item);
    });
  }
  async function loadPublicComments() {
    try {
      const comments = await apiCall('getCommentsForTitle', {title: commentTarget.value});
      renderPublicComments(comments || []);
    } catch (error) {
      $('comments').textContent = 'コメントを読み込めません。GAS側にApiBridge.gsを追加して再デプロイしてください。';
      setStatus('comment-status', error.message, true);
    }
  }
  async function refreshSiteData() {
    try {
      const data = await apiCall('getInitialData');
      if (data && Array.isArray(data.links)) LINKS = data.links;
      populateCategories();
      populateCommentTargets();
      renderLinks();
      await loadPublicComments();
    } catch (error) {
      // API未接続時も資料リンクは表示し続ける。
      populateCategories();
      populateCommentTargets();
      renderLinks();
      $('comments').textContent = 'コメント機能はGAS側のApiBridge.gs追加・再デプロイ後に有効になります。';
      setStatus('comment-status', error.message, true);
    }
  }
  function renderAdminComments(comments) {
    adminComments = comments || [];
    const root = $('admin-comments');
    root.replaceChildren();
    if (!adminComments.length) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'コメントはまだありません。';
      root.append(p);
      return;
    }
    adminComments.forEach(comment => {
      const item = document.createElement('div');
      item.className = 'comment';
      const meta = document.createElement('div');
      meta.className = 'comment-meta';
      const label = document.createElement('label');
      label.style.display = 'flex';
      label.style.alignItems = 'center';
      label.style.gap = '8px';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(comment.resolved);
      checkbox.setAttribute('aria-label', '対応済みにする');
      const labelText = document.createElement('span');
      labelText.textContent = comment.resolved ? '対応済み' : '未対応';
      label.append(checkbox, labelText);
      const date = document.createElement('span');
      date.textContent = comment.timestamp || '';
      meta.append(label, date);
      const target = document.createElement('p');
      target.className = 'muted';
      target.textContent = '対象：' + (comment.title || '');
      const body = document.createElement('p');
      body.textContent = comment.comment || '';
      item.append(meta, target, body);
      checkbox.addEventListener('change', async () => {
        const previous = !checkbox.checked;
        checkbox.disabled = true;
        try {
          await apiCall('setCommentResolved', {token: adminToken, commentId: comment.id, resolved: checkbox.checked});
          setStatus('admin-status', '対応状況を保存しました。');
          await loadAdminData();
          await loadPublicComments();
        } catch (error) {
          checkbox.checked = previous;
          setStatus('admin-status', error.message, true);
        } finally {
          checkbox.disabled = false;
        }
      });
      root.append(item);
    });
  }
  async function loadAdminData() {
    try {
      const data = await apiCall('getAdminData', {token: adminToken});
      renderAdminComments(data.comments || []);
      setStatus('admin-status', '最新のデータを表示中');
    } catch (error) {
      adminToken = '';
      $('admin-panel').classList.add('hidden');
      $('admin-logged-out').classList.remove('hidden');
      setStatus('admin-status', error.message, true);
    }
  }

  $('search').addEventListener('input', renderLinks);
  categorySelect.addEventListener('change', renderLinks);
  commentTarget.addEventListener('change', loadPublicComments);
  $('comment-form').addEventListener('submit', async event => {
    event.preventDefault();
    const title = commentTarget.value;
    const comment = $('comment-text').value.trim();
    if (!comment) return;
    const button = $('comment-form').querySelector('button[type="submit"]');
    button.disabled = true;
    setStatus('comment-status', '投稿中…');
    try {
      const result = await apiCall('addComment', {title, comment});
      $('comment-text').value = '';
      setStatus('comment-status', (result && result.message) || 'コメントを投稿しました。');
      await loadPublicComments();
    } catch (error) {
      setStatus('comment-status', error.message, true);
    } finally {
      button.disabled = false;
    }
  });
  $('admin-login').addEventListener('click', async () => {
    const password = $('admin-password').value;
    if (!password) {
      setStatus('admin-status', '管理者パスワードを入力してください。', true);
      return;
    }
    $('admin-login').disabled = true;
    setStatus('admin-status', '確認中…');
    try {
      const result = await apiCall('adminLogin', {password});
      if (!result || !result.ok) throw new Error((result && result.message) || 'ログインに失敗しました。');
      adminToken = result.token;
      $('admin-password').value = '';
      $('admin-logged-out').classList.add('hidden');
      $('admin-panel').classList.remove('hidden');
      await loadAdminData();
    } catch (error) {
      setStatus('admin-status', error.message, true);
    } finally {
      $('admin-login').disabled = false;
    }
  });
  $('admin-password').addEventListener('keydown', event => {
    if (event.key === 'Enter') $('admin-login').click();
  });
  $('add-link').addEventListener('click', async () => {
    const title = $('new-title').value.trim();
    const description = $('new-description').value.trim();
    const url = $('new-url').value.trim();
    const category = $('new-category').value.trim() || 'tests';
    if (!title || !url) {
      setStatus('admin-status', 'リンク名とURLを入力してください。', true);
      return;
    }
    $('add-link').disabled = true;
    setStatus('admin-status', 'リンクを追加中…');
    try {
      const result = await apiCall('addLink', {token: adminToken, title, description, url, category});
      $('new-title').value = '';
      $('new-description').value = '';
      $('new-url').value = '';
      $('new-category').value = '';
      setStatus('admin-status', (result && result.message) || 'リンクを追加しました。');
      await refreshSiteData();
      await loadAdminData();
    } catch (error) {
      setStatus('admin-status', error.message, true);
    } finally {
      $('add-link').disabled = false;
    }
  });
  $('clear-comments').addEventListener('click', async () => {
    if (!window.confirm('過去のコメントをすべて削除します。この操作は元に戻せません。続けますか？')) return;
    $('clear-comments').disabled = true;
    setStatus('admin-status', 'コメントをクリア中…');
    try {
      const result = await apiCall('clearAllComments', {token: adminToken});
      setStatus('admin-status', (result && result.message) || 'コメントをクリアしました。');
      await loadPublicComments();
      await loadAdminData();
    } catch (error) {
      setStatus('admin-status', error.message, true);
    } finally {
      $('clear-comments').disabled = false;
    }
  });

  $('admin-panel').classList.add('hidden');
  populateCategories();
  populateCommentTargets();
  renderLinks();
  refreshSiteData();
})();
</script>
</body>
</html>
