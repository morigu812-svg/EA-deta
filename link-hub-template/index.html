<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101411">
<meta name="description" content="自作サイトやGitHubリポジトリをまとめて管理するリンク集。">
<title>My Link Hub</title>
<style>
:root{color-scheme:dark;--bg:#101411;--panel:#191f1b;--panel2:#202822;--border:#303b32;--text:#f1f5f1;--muted:#a0ada2;--green:#a8f0b6;--danger:#ff9b9b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0%,#203c2a 0,transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1120px,calc(100% - 30px));margin:auto;padding:28px 0 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:38px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--green);color:#102116;font-weight:900;font-size:23px}
h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:13px;margin:4px 0 0}.hero{margin-bottom:24px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.15em;font-weight:800;margin-bottom:10px}.hero h2{font-size:clamp(30px,5vw,48px);line-height:1.13;letter-spacing:-.04em;margin:0 0 12px}.hero p{color:var(--muted);line-height:1.8;margin:0}
.toolbar{display:flex;gap:10px;margin:24px 0 14px}.search{flex:1}.field{width:100%;background:#141a16;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 13px;outline:none}.field:focus{border-color:var(--green)}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:650}.btn-primary{background:var(--green);border-color:var(--green);color:#102116}.btn-danger{color:var(--danger)}.btn-small{font-size:12px;padding:7px 9px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:8px 13px;font-size:13px}.chip.active{background:#193d28;color:var(--green);border-color:#41664b}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-head h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-width:0;background:linear-gradient(145deg,#1b231d,#151a16);border:1px solid var(--border);border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-2px);border-color:#5b7960}.cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.tag{background:#25342a;color:var(--green);padding:5px 9px;border-radius:8px;font-size:11px}.card h3{font-size:17px;margin:0;overflow-wrap:anywhere}.desc{color:var(--muted);font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;flex:1;margin:0}.host{color:#b8d9c0;font-size:12px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;padding-top:11px;border-top:1px solid #2b342d}.empty{grid-column:1/-1;border:1px dashed var(--border);border-radius:16px;padding:42px 16px;text-align:center;color:var(--muted);line-height:1.8}.status{min-height:20px;font-size:13px;color:var(--green);margin:12px 0}.error{color:var(--danger)}.notice{font-size:12px;color:var(--muted);line-height:1.7;margin-top:24px}
dialog{width:min(540px,calc(100% - 24px));max-height:90vh;overflow:auto;background:#171e19;color:var(--text);border:1px solid var(--border);border-radius:20px;padding:0}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}.dialog-inner{padding:23px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h2{margin:0;font-size:20px}.close{background:none;border:0;color:var(--muted);font-size:24px}.fieldrow{margin-bottom:14px}.fieldrow label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}textarea{resize:vertical;min-height:80px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}footer{border-top:1px solid var(--border);margin-top:42px;padding-top:18px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{width:calc(100% - 22px);padding-top:20px}.toolbar{flex-direction:column}.grid{grid-template-columns:1fr}.hero h2{font-size:34px}header{align-items:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="brand"><div class="logo">↗</div><div><h1>My Link Hub</h1><p class="muted">Your projects, one place.</p></div></div><button class="btn btn-primary" id="add">＋ リンクを追加</button></header>
<section class="hero"><div class="eyebrow">PERSONAL DASHBOARD</div><h2>すべてのリンクを、<br>ひとつの場所に。</h2><p>自作サイト、GitHubリポジトリ、よく使うWebサービスをまとめて管理。</p></section>
<div class="toolbar"><input class="field search" id="search" type="search" placeholder="サイト名・説明・URLを検索…" aria-label="検索"><button class="btn" id="refresh">↻ 更新</button></div>
<nav class="filters" id="filters" aria-label="カテゴリ"></nav>
<div class="section-head"><h2>リンク一覧</h2><span class="muted" id="count">読み込み中…</span></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<section class="grid" id="grid"><div class="empty">リンクを読み込んでいます…</div></section>
<p class="notice">データはGoogle Apps Script側に保存されます。管理者パスワードを設定し、Webアプリの公開範囲も確認してください。</p>
<footer><span>MY LINK HUB · GITHUB PAGES + GAS</span><span id="footerCount">0 links</span></footer>
</main>
<dialog id="editor"><div class="dialog-inner"><div class="dialog-head"><h2 id="dialogTitle">リンクを追加</h2><button class="close" id="close" aria-label="閉じる">×</button></div>
<form id="form"><input type="hidden" id="id">
<div class="fieldrow"><label for="name">サイト名 *</label><input class="field" id="name" maxlength="100" required></div>
<div class="fieldrow"><label for="url">サイトURL *</label><input class="field" id="url" type="url" maxlength="2000" placeholder="https://example.com" required></div>
<div class="fieldrow"><label for="category">カテゴリ</label><input class="field" id="category" maxlength="40" list="categories" placeholder="自作サイト"><datalist id="categories"><option value="自作サイト"><option value="開発ツール"><option value="学習"><option value="参考資料"><option value="その他"></datalist></div>
<div class="fieldrow"><label for="description">説明</label><textarea class="field" id="description" maxlength="500"></textarea></div>
<div class="fieldrow"><label for="githubUrl">GitHubリポジトリURL（任意）</label><input class="field" id="githubUrl" type="url" maxlength="2000" placeholder="https://github.com/user/repo"></div>
<div class="fieldrow"><label for="password">管理者パスワード（追加・編集・削除に必要）</label><input class="field" id="password" type="password" autocomplete="current-password" required></div>
<div class="status" id="formStatus" role="status"></div><div class="formactions"><button class="btn" id="cancel" type="button">キャンセル</button><button class="btn btn-primary" id="save" type="submit">保存する</button></div></form></div></dialog>
<script>
(() => {
'use strict';
// GASウェブアプリをデプロイした後、ここに /exec URL を設定する。
const API_URL = 'PASTE_YOUR_GAS_WEB_APP_EXEC_URL_HERE';
const state = {links:[], category:'すべて', query:'', busy:false};
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function host(value){try{return new URL(value).hostname}catch(_){return value}}
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function formStatus(message,error=false){$('formStatus').textContent=message;$('formStatus').classList.toggle('error',error)}

// ApiBridge: hidden form POST -> GAS HtmlService iframe -> EA_DATA_RESULT postMessage
function apiCall(action,args={}) {
  return new Promise((resolve,reject)=>{
    if(!API_URL || API_URL.indexOf('/macros/s/')<0 || API_URL.includes('PASTE_YOUR')) {
      reject(new Error('index.html の API_URL にGASの /exec URLを設定してください。')); return;
    }
    const requestId='hub_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    const iframe=document.createElement('iframe');iframe.name=requestId+'_frame';iframe.hidden=true;iframe.title='Link Hub API';
    const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target=iframe.name;form.hidden=true;
    const payload=document.createElement('input');payload.type='hidden';payload.name='payload';payload.value=JSON.stringify({requestId,action,args});form.appendChild(payload);
    let finished=false;
    const cleanup=()=>{window.removeEventListener('message',onMessage);clearTimeout(timer);form.remove();iframe.remove()};
    const finish=(fn,value)=>{if(finished)return;finished=true;cleanup();fn(value)};
    const onMessage=event=>{
      const data=event.data;
      if(!data||data.type!=='EA_DATA_RESULT'||data.requestId!==requestId)return;
      if(data.ok)finish(resolve,data.data);else finish(reject,new Error(data.error||'APIエラーが発生しました。'));
    };
    window.addEventListener('message',onMessage);
    const timer=setTimeout(()=>finish(reject,new Error('GASから応答がありません。API URL・デプロイ設定を確認してください。')),20000);
    document.body.append(iframe,form);form.submit();
  });
}
function load(){
  $('grid').innerHTML='<div class="empty">読み込み中…</div>';status('');
  apiCall('getLinks').then(links=>{state.links=Array.isArray(links)?links:[];render()}).catch(error=>{
    $('grid').innerHTML='<div class="empty">リンクを読み込めませんでした。<br>API URLとGASのデプロイ設定を確認してください。</div>';
    $('count').textContent='読み込みエラー';status(error.message,true);
  });
}
function render(){
  const categories=[...new Set(state.links.map(x=>x.category||'その他'))].sort((a,b)=>a.localeCompare(b,'ja'));
  const all=['すべて',...categories];if(!all.includes(state.category))state.category='すべて';
  $('filters').innerHTML=all.map(c=>'<button type="button" class="chip '+(state.category===c?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('');
  $('filters').querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.category;render()}));
  const q=state.query.trim().toLocaleLowerCase();
  const items=state.links.filter(x=>(state.category==='すべて'||(x.category||'その他')===state.category)&&[x.name,x.url,x.category,x.description,x.githubUrl].join(' ').toLocaleLowerCase().includes(q));
  $('count').textContent=items.length+' / '+state.links.length+' 件';$('footerCount').textContent=state.links.length+' links';
  if(!items.length){$('grid').innerHTML='<div class="empty">'+(state.links.length?'条件に一致するリンクがありません。':'まだリンクがありません。「リンクを追加」から登録してください。')+'</div>';return}
  $('grid').innerHTML=items.map(x=>{
    const url=safeUrl(x.url),gh=x.githubUrl?safeUrl(x.githubUrl):'';
    return '<article class="card"><div class="cardtop"><span class="tag">'+esc(x.category||'その他')+'</span><button class="btn btn-small edit" data-id="'+esc(x.id)+'">編集</button></div><h3>'+esc(x.name)+'</h3><p class="desc">'+esc(x.description||'説明はありません。')+'</p><a class="host" href="'+esc(url||'#')+'" '+(url?'target="_blank" rel="noopener noreferrer"':'')+'>↗ '+esc(host(x.url))+'</a><div class="actions"><button class="btn btn-primary btn-small open" data-id="'+esc(x.id)+'">サイトを開く ↗</button>'+(gh?'<a class="btn btn-small" href="'+esc(gh)+'" target="_blank" rel="noopener noreferrer">GitHub ↗</a>':'')+'<button class="btn btn-danger btn-small delete" data-id="'+esc(x.id)+'">削除</button></div></article>';
  }).join('');
  $('grid').querySelectorAll('.edit').forEach(b=>b.addEventListener('click',()=>openEditor(state.links.find(x=>x.id===b.dataset.id))));
  $('grid').querySelectorAll('.delete').forEach(b=>b.addEventListener('click',()=>remove(b.dataset.id)));
  $('grid').querySelectorAll('.open').forEach(b=>b.addEventListener('click',()=>{const x=state.links.find(y=>y.id===b.dataset.id);const u=x&&safeUrl(x.url);if(u)window.open(u,'_blank','noopener,noreferrer')}));
}
function openEditor(item=null){
  $('form').reset();$('id').value=item?item.id:'';$('dialogTitle').textContent=item?'リンクを編集':'リンクを追加';
  $('name').value=item?item.name:'';$('url').value=item?item.url:'';$('category').value=item?item.category:'自作サイト';
  $('description').value=item?item.description:'';$('githubUrl').value=item?item.githubUrl:'';formStatus('');$('editor').showModal();$('name').focus();
}
function closeEditor(){if(!state.busy)$('editor').close()}
$('form').addEventListener('submit',event=>{
  event.preventDefault();if(state.busy)return;
  const url=safeUrl($('url').value),githubUrl=$('githubUrl').value.trim();
  if(!url){formStatus('有効なHTTP/HTTPSのURLを入力してください。',true);return}
  if(githubUrl&&!safeUrl(githubUrl)){formStatus('GitHub URLを確認してください。',true);return}
  const link={id:$('id').value,name:$('name').value,url,category:$('category').value,description:$('description').value,githubUrl};
  state.busy=true;$('save').disabled=true;$('save').textContent='保存中…';formStatus('保存しています…');
  apiCall('saveLink',{link,adminPassword:$('password').value}).then(()=>{
    $('editor').close();status('リンクを保存しました。');load();
  }).catch(e=>formStatus(e.message,true)).finally(()=>{state.busy=false;$('save').disabled=false;$('save').textContent='保存する'});
});
function remove(id){
  const item=state.links.find(x=>x.id===id);if(!item)return;
  const password=prompt('削除するには管理者パスワードを入力してください。');if(password===null)return;
  if(!confirm('「'+item.name+'」を削除しますか？'))return;
  apiCall('deleteLink',{id,adminPassword:password}).then(()=>{status('リンクを削除しました。');load()}).catch(e=>status(e.message,true));
}
$('add').addEventListener('click',()=>openEditor());$('close').addEventListener('click',closeEditor);$('cancel').addEventListener('click',closeEditor);
$('refresh').addEventListener('click',load);$('search').addEventListener('input',e=>{state.query=e.target.value;render()});
$('editor').addEventListener('click',e=>{if(e.target===$('editor'))closeEditor()});
load();
})();
</script>
</body>
</html>
